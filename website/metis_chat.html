<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metis</title>
  <link rel="stylesheet" href="stylesheet.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="logo">M</div>
        <button class="new-chat" type="button">+ New chat</button>

        <div class="bot-selector">
          <label for="botChoice">Choose a bot</label>
          <select id="botChoice">
            <option value="brief">Assignment Brief Information</option>
            <option value="calendar">Assignment Calendars</option>
            <option value="mitigating">Mitigating Circumstances Advice</option>
          </select>
        </div>
      </div>

      <nav class="chat-list">
        <div class="chat-item active">Welcome to Metis</div>
        <div class="chat-item">Recent question 1</div>
        <div class="chat-item">Recent question 2</div>
        <div class="chat-item">Recent question 3</div>
      </nav>

      <div class="sidebar-bottom">
        <div class="profile">
          <div class="avatar">U</div>
          <span>User</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="botTitle">Metis</h1>
          <span class="status" id="botStatus">Assignment Brief Information bot</span>
        </div>
      </header>

      <section class="chat-area" id="chatArea">
        <div class="message bot">
          <div class="message-avatar">M</div>
          <div class="message-content">
            <p id="welcomeMessage">
              Hello, I’m Metis. I can help you with assignment brief information.
            </p>
          </div>
        </div>
      </section>

      <section class="suggestions" id="suggestions">
        <button type="button">Show brief details</button>
        <button type="button">Explain requirements</button>
        <button type="button">Find submission info</button>
        <button type="button">Summarize the brief</button>
      </section>

      <form class="input-area">
        <input
          type="text"
          id="messageInput"
          placeholder="Ask about the assignment brief..."
        />
        <button type="submit">Send</button>
      </form>
    </main>
  </div>

  <script>
    const botChoice = document.getElementById("botChoice");
    const botTitle = document.getElementById("botTitle");
    const botStatus = document.getElementById("botStatus");
    const welcomeMessage = document.getElementById("welcomeMessage");
    const messageInput = document.getElementById("messageInput");
    const suggestions = document.getElementById("suggestions");

    const botData = {
      brief: {
        title: "Metis",
        status: "Assignment Brief Information bot",
        welcome: "Hello, I’m Metis. I can help you with assignment brief information.",
        placeholder: "Ask about the assignment brief...",
        suggestionButtons: [
          "Show brief details",
          "Explain requirements",
          "Find submission info",
          "Summarize the brief"
        ]
      },
      calendar: {
        title: "Metis",
        status: "Assignment Calendars bot",
        welcome: "Hello, I’m Metis. I can help you with assignment calendars and key dates.",
        placeholder: "Ask about deadlines and calendar dates...",
        suggestionButtons: [
          "Show assignment deadlines",
          "List upcoming dates",
          "Check submission timeline",
          "What is due this week?"
        ]
      },
      mitigating: {
        title: "Metis",
        status: "Mitigating Circumstances Advice bot",
        welcome: "Hello, I’m Metis. I can help you with mitigating circumstances guidance.",
        placeholder: "Ask about mitigating circumstances...",
        suggestionButtons: [
          "What are mitigating circumstances?",
          "How do I apply?",
          "What evidence is needed?",
          "What deadlines apply?"
        ]
      }
    };

    function updateBotUI(selectedBot) {
      const data = botData[selectedBot];

      botTitle.textContent = data.title;
      botStatus.textContent = data.status;
      welcomeMessage.textContent = data.welcome;
      messageInput.placeholder = data.placeholder;

      suggestions.innerHTML = "";
      data.suggestionButtons.forEach(text => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = text;
        suggestions.appendChild(button);
      });
    }

    botChoice.addEventListener("change", function () {
      updateBotUI(this.value);
    });

    updateBotUI(botChoice.value);
  </script>
</body>
</html>
