<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metis | Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css" />
</head>

<body>
  <div class="page-wrapper">


    <header class="site-header">
      <button class="hamburger" onclick="toggleMenu()" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
      <div class="logo">
        <img src="/static/logo4.png" alt="Metis Logo" />
        <span>Metis</span>
      </div>
      <div class="header-spacer"></div>
    </header>

    <!-- Overlay -->
    <div class="menu-overlay" onclick="toggleMenu()"></div>

    <!-- Side Menu -->
    <nav class="side-menu" id="sideMenu">
      <button class="menu-close" onclick="toggleMenu()" aria-label="Close menu">&#10005;</button>
      <a href="/">Home</a>
      <a href="/login">Login</a>
      <div class="side-menu-dropdown" id="botsDropdown">
        <span class="side-menu-dropdown-toggle" id="botsToggle">Bots &#9658;</span>
      </div>
      <a href="/your-calendar">Your Calendar</a>
      <a href="/faqs">FAQs</a>
      <a href="/about">About Us</a>
      <a href="/contact">Contact Us</a>
    </nav>

    <!-- Bots Submenu -->
    <div class="side-menu-dropdown-items" id="botsSubmenu">
      <a href="/assignment-brief">Assignment Brief Info</a>
      <a href="/mitigating-circumstances">Mitigating Circumstances</a>
      <a href="/assignment-calendar">Assignment Calendars Creator</a>
      <a href="/assignment-reviewer">Assignment Reviewer</a>
    </div>

    <div class="auth-wrapper">
      <div class="auth-card">
        <h2>Login</h2>
        <p class="subtitle">Sign in to your Metis account</p>

        <div class="auth-error" id="errorBox"></div>

        <form method="POST" action="/api/login">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username" />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" />
          </div>

          <button type="submit" class="auth-btn">Login</button>
        </form>

        <p class="auth-footer">
          Don't have an account? <a href="/signup">Sign up</a>
        </p>
      </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
      <p>&copy; 2026 Metis. All rights reserved.</p>
    </footer>

  </div>

  <script src="/static/scripts.js"></script>
  <script>
    const errors = {
      invalid_credentials: "Incorrect username or password.",
      missing_fields: "Please fill in all fields.",
    };

    const params = new URLSearchParams(window.location.search);
    const err = params.get("error");
    if (err) {
      const box = document.getElementById("errorBox");
      box.textContent = errors[err] || "An error occurred. Please try again.";
      box.classList.add("visible");
    }
  </script>
</body>

</html>
