services:
  metis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metis-app
    working_dir: /workspace
    ports:
      - "8000:8000"
    env_file:
      - ./app/.env
    volumes:
      - ./app:/workspace/app
      - ./website:/workspace/website
      - metis_data:/workspace/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: metis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: metis-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles: ["local-llm"]
    restart: unless-stopped

volumes:
  metis_data:
  redis_data:
  ollama_data: